name: Browser tests

# The tests only need to read the code they run against.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also on pushes to main, so anything that lands without going through a pull
  # request is still tested.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: Browser ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Browser tests

    env:
      DB_CONNECTION: sqlite

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: $/.github/actions/setup-php
        with:
          extensions: mbstring, dom, fileinfo, gd, sqlite

      # Same reason as in the Static analysis workflow: the vite binary runs on
      # node, and pinning it keeps the build stable across runner images.
      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # A browser runs the scripts and the styles for real, so the stub
      # manifest of the Unit tests workflow is not enough here.
      - name: Build assets
        run: bun run build

      # The browser binary weighs about 150 MB and only changes when Playwright
      # does, so it is kept between runs. The system libraries it needs are not
      # part of the cache and are installed every time.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install the browser dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Prepare environment
        run: |
          cp tests/.env.ci.sqlite .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
