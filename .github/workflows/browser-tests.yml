name: Browser tests

# The tests only need to read the code they run against.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also on pushes to main, so anything that lands without going through a pull
  # request is still tested.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: Browser ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Browser tests

    env:
      DB_CONNECTION: sqlite

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          extensions: mbstring, dom, fileinfo, gd, sqlite

      # Same reason as in the Static analysis workflow: the vite binary runs on
      # node, and pinning it keeps the build stable across runner images.
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # A browser runs the scripts and the styles for real, so the stub
      # manifest of the Unit tests workflow is not enough here.
      - name: Build assets
        run: bun run build

      # The browser binary weighs about 150 MB and only changes when Playwright
      # does, so it is kept between runs. The system libraries it needs are not
      # part of the cache and are installed every time.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install the browser dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Prepare environment
        run: |
          cp tests/.env.ci.sqlite .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
