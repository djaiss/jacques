# Keeps the pinned action versions in the workflows current. Every action is
# pinned to a commit, so without this nothing would ever move them.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite action they share.
    directories:
      - /
      - /.github/actions/setup-php
    schedule:
      interval: weekly
    # A release a week old has had time to be pulled if it was bad.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
